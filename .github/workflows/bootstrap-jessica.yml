name: bootstrap-jessica

on:
  push:
    paths:
      - ".bootstrap/ready"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct Jessica source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/jessica.zip.b64
          base64 --decode /tmp/jessica.zip.b64 > /tmp/jessica.zip
          mkdir -p /tmp/jessica-unpacked
          unzip -q /tmp/jessica.zip -d /tmp/jessica-unpacked
          rsync -a --delete --exclude='.git/' /tmp/jessica-unpacked/jessica/ ./
      - name: Remove bootstrap transport
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-jessica.yml
      - name: Commit canonical Jessica tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ai-systems-tw"
          git config user.email "ai.systems.tw@gmail.com"
          git add -A
          git commit -m "feat: publish Jessica foundation design and implementation"
          git push origin HEAD:main
